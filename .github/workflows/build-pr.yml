name: build/pr
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: build-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.version }}
      version_json: ${{ steps.metadata.outputs.json }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        uses: tiouoo/tiller/rolling-version@main
        with:
          epoch: '2026-10-18 00:00:00'
      - id: source
        run: |
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "base_version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('src/app/Pollen/BuildValues.props').findtext('./PropertyGroup/PollenBaseVersion'))")" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(TZ=Asia/Shanghai date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
      - id: metadata
        uses: tiouoo/tiller/metadata@main
        with:
          type: pr
          version: ${{ steps.source.outputs.base_version }}
          commit: ${{ steps.source.outputs.commit }}
          title: build-pr-${{ github.event.pull_request.number }}-${{ steps.version.outputs.version }}-${{ github.run_id }}-${{ steps.source.outputs.commit }}
          timestamp: ${{ steps.source.outputs.timestamp }}
  build:
    env:
      POLLEN_BUILD_TYPE: ${{ fromJSON(needs.prepare.outputs.version_json)['type'] }}
      POLLEN_BUILD_VERSION: ${{ fromJSON(needs.prepare.outputs.version_json)['version'] }}
      POLLEN_BUILD_TIME: ${{ fromJSON(needs.prepare.outputs.version_json)['build-time'] }}
      POLLEN_BUILD_ACTION: ${{ fromJSON(needs.prepare.outputs.version_json)['action'] }}
      POLLEN_BUILD_COMMIT: ${{ fromJSON(needs.prepare.outputs.version_json)['commit'] }}
      POLLEN_BUILD_TIMESTAMP: ${{ fromJSON(needs.prepare.outputs.version_json)['timestamp'] }}
      POLLEN_BUILD_VERSION_TITLE: ${{ fromJSON(needs.prepare.outputs.version_json)['version_title'] }}
      POLLEN_PACKAGE_TYPE: pr
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-22.04
            rid: linux-x64
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install Native AOT dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Build PR
        shell: bash
        env:
          APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          RID: ${{ matrix.rid }}
        run: |
          dotnet publish src/app/Pollen.Desktop/Pollen.Desktop.csproj -c Release -r "$RID" --self-contained true -p:Version="$APP_VERSION" -p:DebugType=none -p:DebugSymbols=false -o dist
          tar -czf "Pollen.${RID}.PR.tar.gz" -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: Pollen.${{ matrix.rid }}.PR-${{ github.event.pull_request.number }}
          path: Pollen.${{ matrix.rid }}.PR.tar.gz
          retention-days: 7
          if-no-files-found: error
