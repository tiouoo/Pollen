name: build/pr comment
on:
  workflow_run:
    workflows: [build/pr]
    types: [completed]
permissions:
  contents: read
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # This privileged job only reads run metadata; it never checks out PR code.
      - uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const marker = '<!-- pollen-pr-build -->';
            const body = `${marker}\nPR 自动化构建已完成（Windows x64 / Linux x64）。\n\n[下载构建产物](${run.html_url})`;
            for (const pr of run.pull_requests) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number: pr.number
              });
              const existing = comments.find(c => c.user.type === 'Bot' && c.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({...context.repo, comment_id: existing.id, body});
              } else {
                await github.rest.issues.createComment({...context.repo, issue_number: pr.number, body});
              }
            }
